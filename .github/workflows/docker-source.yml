name: Docker image (from source)

# Builds THIS branch's engine from source inside Docker (tools/docker/Dockerfile.src) and publishes the finished image to
# ghcr.io.  Run by hand only: Actions tab -> "Docker image (from source)" -> Run workflow.
#
# Why a workflow of its own, next to docker-images.yml: that one packs a release's engine packages, while this one
# compiles the tree it runs from.  Keeping them apart means an upstream change to either never conflicts with the other.
#
#   ghcr.io/<owner>/<repo>:<tag>-cuda13   and   ghcr.io/<owner>/<repo>:<tag>
#
# The first run with "push" off builds everything and publishes nothing (a dry run).  The engine compile is the long
# pole and is cached by BuildKit (gha cache), so a second run of the same tree reuses it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (for example 0.2.18-lmcache.2)'
        required: true
        default: '0.2.18-lmcache.2'
        type: string
      cuda_architectures:
        description: 'CUDA architectures: 86 = A10/A40, 89 = RTX 40, 120 = RTX 50; empty = all five (much slower)'
        required: true
        default: '86'
        type: string
      build_vision:
        description: 'Build the picture reader too (needs more time and disk)'
        required: true
        default: true
        type: boolean
      push:
        description: 'Push the image to ghcr.io (off: build only, nothing is published)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 4 cores / 16 GB / ~60 GB disk: the CUDA 13 devel base alone is 11 GB, so the runner's disk is freed first.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Image name
        # ghcr.io wants a lowercase repository name; github.repository keeps the owner's capitalisation.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/Dockerfile.src
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}-cuda13
            ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: |
            STRATA_COMMIT=${{ github.sha }}
            STRATA_VERSION=${{ inputs.tag }}
            CUDA_ARCHITECTURES=${{ inputs.cuda_architectures }}
            BUILD_VISION=${{ inputs.build_vision && '1' || '0' }}
          cache-from: type=gha,scope=strata-source
          cache-to: type=gha,mode=max,scope=strata-source

      - name: What was built
        if: always()
        run: docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true

# The store image is not built here: it is small, CPU-only and changes only when LMCache's version does.
#   docker build -f tools/lmcache/store.Dockerfile -t lmcache-cpu:0.5.7 tools/lmcache
